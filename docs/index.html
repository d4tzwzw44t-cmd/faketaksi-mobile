<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b121a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="FakeTaksi"><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><title>FakeTaksi · Simülasyon</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b121a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}button{border:0;cursor:pointer;font-weight:750}header{height:calc(150px + env(safe-area-inset-top));padding:calc(24px + env(safe-area-inset-top)) 20px 0;background:linear-gradient(130deg,#091521,#233343);text-align:center}header h1{font-size:36px;letter-spacing:-1.6px;margin:4px 0}header h1 em{font-style:normal;color:#ffce1c}header small{font-size:10px;letter-spacing:3px;color:#c8d0da}.simulation{position:absolute;right:14px;top:calc(18px + env(safe-area-inset-top));font-size:9px;color:#ffd529;border:1px solid #ffd529;border-radius:7px;padding:5px 7px}.search{position:relative;margin:-32px 15px 8px;background:#fff;color:#111827;border-radius:19px;padding:13px 18px;z-index:600;box-shadow:0 9px 22px #0004}.searchrow{display:flex;align-items:center;gap:12px;min-height:45px}.searchrow+ .searchrow{border-top:1px solid #e6e8ed}.dot{width:13px;height:13px;background:#20a15e;border:3px solid #ccebdc;border-radius:50%;flex-shrink:0}.dot.dest{background:#ee5353;border-color:#ffdbdb}.searchrow b{font-size:13px}.searchrow small{font-size:12px;color:#667085}.searchrow input{width:100%;border:0;outline:0;font-size:13px}.shortcuts{display:flex;gap:8px;padding:2px 13px 10px;overflow:auto}.shortcuts button{background:#1c2934;color:white;border:1px solid #3b4855;border-radius:20px;padding:10px 14px;white-space:nowrap;font-size:12px}#map{height:calc(100dvh - 495px - env(safe-area-inset-top));min-height:210px;background:#dce6ed}.leaflet-control-attribution{font-size:8px!important}.leaflet-div-icon{border:0;background:none}.pickup{height:23px;width:23px;border-radius:50%;background:#19a35b;border:5px solid white;box-shadow:0 0 0 4px #16a34a66}.taxi{background:#ffcf20;border:2px solid #171717;border-radius:12px;box-shadow:0 3px 10px #0007;width:45px;height:34px;display:grid;place-items:center}.taxi svg{width:40px;height:29px}.sheet{background:linear-gradient(#111c26,#0b121a);border-radius:27px 27px 0 0;margin-top:-15px;position:relative;z-index:400;padding:13px 16px calc(15px + env(safe-area-inset-bottom));min-height:245px}.handle{height:5px;width:48px;background:#ffd31e;border-radius:10px;margin:0 auto 13px}.sheet h2{font-size:18px;margin:0 0 10px}.card{display:flex;align-items:center;gap:11px;background:#15212c;border:1px solid #34414b;border-radius:15px;padding:12px;margin:8px 0}.portrait{height:56px;width:56px;border-radius:50%;background:linear-gradient(140deg,#334b5d,#17232e);display:grid;place-items:center;flex-shrink:0;overflow:hidden}.portrait svg{width:100%;height:100%}.details{flex:1;min-width:0}.details b{font-size:14px}.details small{display:block;color:#c2ccd4;font-size:11px;margin:4px 0}.plate{display:inline-block;background:#ffd21f;color:#111;border-radius:4px;padding:3px 6px;font-size:10px;font-weight:900}.rating{color:#ffd21f;font-size:11px}.carname{font-size:11px;color:#d2d8df;margin-top:5px}.primary{background:#ffce1b;color:#111;border-radius:12px;padding:13px 16px;font-size:12px}.full{width:100%;margin-top:10px;font-size:15px}.muted{font-size:11px;color:#acbac5}.eta{color:#ffce1b;font-size:44px;font-weight:900;margin:6px 0}.actions{display:flex;gap:10px;margin-top:12px}.actions button{flex:1;padding:13px;border-radius:12px;background:#23303c;color:white}.actions button:last-child{color:#ff7777}.fine{text-align:center;color:#a9b6bf;font-size:10px;margin:10px 0 0}.hide{display:none!important}
</style></head><body>
<header><span class="simulation">SİMÜLASYON</span><h1>Fake<em>Taksi</em></h1><small>İSTANBUL · SANAL TAKSİ</small></header>
<div class="search"><div class="searchrow"><i class="dot"></i><div><b>Konumunuz</b><br><small id="where">Konum belirleniyor...</small></div></div><div class="searchrow"><i class="dot dest"></i><input id="destination" placeholder="Nereye gitmek istiyorsunuz? (isteğe bağlı)" /></div></div>
<div class="shortcuts"><button data-d="Ev">⌂ Ev</button><button data-d="İş">▣ İş</button><button data-d="AVM">▤ AVM</button><button data-d="Havalimanı">✈ Havalimanı</button></div>
<div id="map"></div><section class="sheet"><div class="handle"></div><div id="idle"><h2>Yakındaki Sanal Taksiler</h2><div id="nearby"></div></div><div id="active" class="hide"><small class="muted">TAKSİNİZ GELİYOR · TAHMİNİ VARIŞ</small><div class="eta" id="eta">7 dk</div><div id="assigned"></div><div class="muted" id="routeStatus">Sanal rota hazırlanıyor...</div><div class="actions"><button id="again">Yeni Taksi</button><button id="cancel">İptal Et</button></div></div><p class="fine">Eğlence amaçlı simülasyon · Gerçek sürücü, çağrı veya ödeme yoktur.</p></section>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const drivers=[{name:'Ahmet K.',model:'Fiat Egea',plate:'34 TJA 58',rating:'4.9'},{name:'Mehmet Y.',model:'Fiat Egea',plate:'34 THK 23',rating:'4.8'},{name:'Serkan T.',model:'Toyota Corolla',plate:'34 TDK 91',rating:'4.7'},{name:'Murat D.',model:'Fiat Egea',plate:'34 TBC 42',rating:'4.9'},{name:'Emre A.',model:'Hyundai i20',plate:'34 TFG 16',rating:'4.8'}];
const car="<svg viewBox=\"0 0 90 60\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"17\" y=\"11\" width=\"56\" height=\"39\" rx=\"12\" fill=\"#1c2934\"/><rect x=\"23\" y=\"17\" width=\"44\" height=\"27\" rx=\"8\" fill=\"#f8fafc\"/><rect x=\"28\" y=\"20\" width=\"34\" height=\"20\" rx=\"5\" fill=\"#425b6d\"/><rect x=\"30\" y=\"5\" width=\"30\" height=\"12\" rx=\"3\" fill=\"#171717\"/><text x=\"45\" y=\"14\" fill=\"#ffd21f\" font-size=\"8\" text-anchor=\"middle\">TAKSİ</text><rect x=\"9\" y=\"21\" width=\"9\" height=\"11\" rx=\"3\" fill=\"#171717\"/><rect x=\"72\" y=\"21\" width=\"9\" height=\"11\" rx=\"3\" fill=\"#171717\"/></svg>",face="<svg viewBox=\"0 0 70 70\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"70\" height=\"70\" fill=\"#526b7c\"/><path d=\"M7 70Q9 45 35 46Q61 45 63 70\" fill=\"#18212a\"/><ellipse cx=\"35\" cy=\"29\" rx=\"17\" ry=\"21\" fill=\"#c58e67\"/><path d=\"M18 26Q14 3 35 7Q57 5 52 28L47 19Q35 23 23 18Z\" fill=\"#211b19\"/><circle cx=\"29\" cy=\"30\" r=\"1.6\"/><circle cx=\"41\" cy=\"30\" r=\"1.6\"/><path d=\"M26 41Q35 48 44 41Q41 55 35 54Q29 54 26 41\" fill=\"#30211e\"/><path d=\"M28 39Q35 43 42 39\" stroke=\"#492e26\" fill=\"none\" stroke-width=\"2\"/></svg>",icon=L.divIcon({className:'',html:'<div class="taxi">'+car+'</div>',iconSize:[45,34],iconAnchor:[22,17]}),pinIcon=L.divIcon({className:'',html:'<div class="pickup"></div>',iconSize:[23,23],iconAnchor:[11,11]});
let pickup=[41.0422,28.9784],cars=[],active=null,route=[],routeLine=null,vehicle=null,tick=null,selection=null,token=0;
const map=L.map('map',{zoomControl:false}).setView(pickup,14);L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{maxZoom:19,attribution:'© OpenStreetMap © CARTO'}).addTo(map);const pin=L.marker(pickup,{icon:pinIcon}).addTo(map);
function origins(){const offset=Math.random()*Math.PI*2;return drivers.slice(0,3).map((d,i)=>{const a=offset+i*2.094+(Math.random()-.5)*.3,r=.004+Math.random()*.008;return {...d,lat:pickup[0]+Math.sin(a)*r,lon:pickup[1]+Math.cos(a)*r,mins:5+Math.floor(Math.random()*6)}})}
function card(d,i){return '<div class="card"><div class="portrait">'+face+'</div><div class="details"><b>'+d.name+'</b><small><span class="rating">★ '+d.rating+'</span> · '+d.mins+' dk uzakta</small><span class="plate">'+d.plate+'</span><div class="carname">'+d.model+' · Sarı Taksi</div></div><button class="primary" data-choose="'+i+'">Çağır</button></div>'}
function nearby(){cars.forEach(x=>map.removeLayer(x.marker));cars=origins().map(d=>({...d,marker:L.marker([d.lat,d.lon],{icon}).addTo(map)}));document.getElementById('nearby').innerHTML=cars.map(card).join('');document.querySelectorAll('[data-choose]').forEach(b=>b.onclick=()=>start(cars[+b.dataset.choose]));}
function locate(lat,lon){if(active)return;pickup=[lat,lon];pin.setLatLng(pickup);map.setView(pickup,15);nearby()}
nearby();if(navigator.geolocation)navigator.geolocation.getCurrentPosition(p=>{locate(p.coords.latitude,p.coords.longitude);document.getElementById('where').textContent='GPS konumunuz aktif'},()=>document.getElementById('where').textContent='Örnek konum · İstanbul',{enableHighAccuracy:true,timeout:10000});else document.getElementById('where').textContent='Örnek konum · İstanbul';
document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>document.getElementById('destination').value=b.dataset.d);
function pointAt(t){if(route.length<2)return pickup;let lengths=[],total=0;for(let i=1;i<route.length;i++){let a=route[i-1],b=route[i],d=Math.hypot((a[0]-b[0])*111000,(a[1]-b[1])*84000);lengths.push(d);total+=d}let target=total*t;for(let i=0;i<lengths.length;i++){if(target<=lengths[i]||i===lengths.length-1){let f=lengths[i]?Math.min(1,target/lengths[i]):0;return [route[i][0]+(route[i+1][0]-route[i][0])*f,route[i][1]+(route[i+1][1]-route[i][1])*f]}target-=lengths[i]}return pickup}
function animate(){if(!active)return;const remaining=Math.max(0,active.duration-(Date.now()-active.started)),t=1-remaining/active.duration;vehicle.setLatLng(pointAt(t));document.getElementById('eta').textContent=remaining?Math.max(1,Math.ceil(remaining/60000))+' dk':'Taksiniz geldi';if(!remaining){clearInterval(tick);document.getElementById('routeStatus').textContent='Sanal taksi konumunuza ulaştı.'}}
async function start(d){stop(false);const current=++token;selection=d;active={started:Date.now(),duration:d.mins*60000};document.getElementById('idle').classList.add('hide');document.getElementById('active').classList.remove('hide');document.getElementById('assigned').innerHTML=card(d,0).replace(/<button class="primary"[^>]*>Çağır<\/button>/,'');cars.forEach(x=>map.removeLayer(x.marker));cars=[];route=[[d.lat,d.lon],pickup];vehicle=L.marker(route[0],{icon}).addTo(map);routeLine=L.polyline(route,{color:'#f7c600',weight:6}).addTo(map);map.fitBounds(route,{padding:[55,55]});tick=setInterval(animate,250);animate();document.getElementById('routeStatus').textContent='Yol güzergâhı hazırlanıyor...';try{let response=await fetch('https://router.project-osrm.org/route/v1/driving/'+d.lon+','+d.lat+';'+pickup[1]+','+pickup[0]+'?overview=full&geometries=geojson');let data=await response.json();if(current!==token||!active)return;if(data.routes&&data.routes[0]){route=data.routes[0].geometry.coordinates.map(x=>[x[1],x[0]]);routeLine.setLatLngs(route);document.getElementById('routeStatus').textContent='Sanal taksi yol güzergâhında ilerliyor.'}else throw Error('route')}catch(e){if(current===token&&active)document.getElementById('routeStatus').textContent='Yol verisi alınamadı; yaklaşık güzergâh gösteriliyor.'}}
function stop(reset=true){token++;clearInterval(tick);active=null;if(vehicle)map.removeLayer(vehicle);if(routeLine)map.removeLayer(routeLine);vehicle=routeLine=null;if(reset){document.getElementById('active').classList.add('hide');document.getElementById('idle').classList.remove('hide');nearby();map.setView(pickup,15)}}
document.getElementById('cancel').onclick=()=>stop();document.getElementById('again').onclick=()=>stop();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
