<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#ffcf20"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="FakeTaksi"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="./icon.svg"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><title>FakeTaksi · Simülasyon</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;background:#f4f5f6;color:#151515}header{height:calc(75px + env(safe-area-inset-top));padding:calc(22px + env(safe-area-inset-top)) 17px 12px;background:#ffcf20;display:flex;align-items:center;justify-content:space-between}header strong{font-size:27px;letter-spacing:-1.1px}header span{background:#161616;color:white;font-size:10px;padding:8px;border-radius:8px;font-weight:800}#map{height:calc(100dvh - 390px - env(safe-area-inset-top));min-height:240px;z-index:0}.location{position:absolute;top:calc(87px + env(safe-area-inset-top));left:15px;right:15px;background:white;border-radius:14px;padding:13px 16px;box-shadow:0 4px 20px #0002;z-index:500}.location b{font-size:13px}.location small{display:block;color:#777;margin-top:4px}main{background:white;border-radius:26px 26px 0 0;padding:23px 22px calc(18px + env(safe-area-inset-bottom));min-height:315px;position:relative;z-index:2;margin-top:-8px}h2{font-size:23px;margin:0 0 8px}p{color:#667085;font-size:13px;margin:8px 0}.choices{display:flex;gap:10px;margin:22px 0 17px}.choices button{flex:1;background:#eee;color:#161616}.choices button.selected{background:#ffcf20}button{border:0;border-radius:13px;padding:16px;font-size:15px;font-weight:800;cursor:pointer}button.primary{background:#151515;color:#ffcf20;width:100%}button.danger{background:#b42318;color:white;width:100%;margin-top:15px}.clock{font-size:46px;font-weight:900;text-align:center;margin:14px 0}.driver{background:#f3f4f6;border-radius:14px;padding:15px;font-size:14px;font-weight:700}.driver small{display:block;color:#667085;font-weight:400;margin-top:5px}.fine{font-size:10px;color:#777;text-align:center;margin-top:17px}.taxi-marker{background:#ffcf20;border:2px solid #151515;border-radius:50%;height:45px;width:45px;display:grid;place-items:center;font-size:25px;box-shadow:0 2px 8px #0003}.pickup-marker{font-size:32px;filter:drop-shadow(0 2px 2px #0006)}.leaflet-div-icon{background:none;border:0}.status{font-size:12px;color:#667085;margin:10px 0}#routeWarning{color:#986000;font-size:11px;margin-top:8px}</style></head>
<body><header><strong>🚕 FakeTaksi</strong><span>SİMÜLASYON</span></header><div id="map"></div><div class="location"><b id="locationText">📍 Konum belirleniyor...</b><small>Gerçek taksiler gösterilmez</small></div><main><div id="idle"><h2>Sanal taksi çağır</h2><p>Yakınındaki sanal taksilerden biri sana gelsin.</p><div class="choices"><button class="selected" data-min="5">5 dakika</button><button data-min="10">10 dakika</button></div><button class="primary" id="call">🚕 SANAL TAKSİ ÇAĞIR</button></div><div id="active" hidden><h2 id="headline">Sanal taksin yaklaşıyor</h2><div class="clock" id="clock">5:00</div><div class="driver">👨‍✈️ Mert Yılmaz · Sanal sürücü<small>Fiat Egea · DEMO-34 (kurgusal plaka)</small></div><div id="routeWarning"></div><button class="danger" id="cancel">SİMÜLASYONU BİTİR</button></div><p class="fine">Eğlence amaçlı simülasyon. Gerçek taksi gönderilmez.</p></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const fallback=[41.0422,28.9784];let pickup=fallback,minutes=5,trip=null,markers=[],moving=null,line=null,route=[],timer=null;
const map=L.map('map',{zoomControl:false}).setView(pickup,15);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
const taxiIcon=L.divIcon({className:'',html:'<div class="taxi-marker">🚕</div>',iconSize:[45,45],iconAnchor:[22,22]});
const pinIcon=L.divIcon({className:'',html:'<div class="pickup-marker">📍</div>',iconSize:[35,40],iconAnchor:[17,40]});
let pin=L.marker(pickup,{icon:pinIcon}).addTo(map);
function candidates(){return [[pickup[0]+.004,pickup[1]-.006],[pickup[0]-.005,pickup[1]+.003],[pickup[0]+.003,pickup[1]+.005]]}
function showNearby(){markers.forEach(m=>map.removeLayer(m));markers=candidates().map(p=>L.marker(p,{icon:taxiIcon}).addTo(map))}
function setPickup(lat,lon){if(trip)return;pickup=[lat,lon];pin.setLatLng(pickup);map.setView(pickup,15);showNearby()}
showNearby();
if(navigator.geolocation){navigator.geolocation.getCurrentPosition(p=>{setPickup(p.coords.latitude,p.coords.longitude);document.getElementById('locationText').textContent='📍 GPS konumun aktif'},()=>{document.getElementById('locationText').textContent='📍 Örnek konum · İstanbul'},{enableHighAccuracy:true,timeout:12000})}else{document.getElementById('locationText').textContent='📍 Örnek konum · İstanbul'}
document.querySelectorAll('[data-min]').forEach(b=>b.onclick=()=>{minutes=+b.dataset.min;document.querySelectorAll('[data-min]').forEach(x=>x.classList.toggle('selected',x===b))});
function interpolate(points,t){if(points.length<2)return pickup;const seg=t*(points.length-1),i=Math.min(points.length-2,Math.floor(seg)),f=seg-i;return [points[i][0]+(points[i+1][0]-points[i][0])*f,points[i][1]+(points[i+1][1]-points[i][1])*f]}
function update(){if(!trip)return;const elapsed=Date.now()-trip.start;const fraction=Math.min(1,elapsed/trip.duration);const point=interpolate(route,fraction);moving.setLatLng(point);const remain=Math.max(0,Math.ceil((trip.duration-elapsed)/1000));document.getElementById('clock').textContent=Math.floor(remain/60)+':'+String(remain%60).padStart(2,'0');if(remain===0){document.getElementById('headline').textContent='Sanal taksin geldi!';clearInterval(timer)}}
document.getElementById('call').onclick=async()=>{const origin=candidates()[0];trip={start:Date.now(),duration:minutes*60000};document.getElementById('idle').hidden=true;document.getElementById('active').hidden=false;markers.forEach(m=>map.removeLayer(m));markers=[];moving=L.marker(origin,{icon:taxiIcon}).addTo(map);route=[origin,pickup];line=L.polyline(route,{color:'#171717',weight:5,dashArray:'8 8'}).addTo(map);map.fitBounds([origin,pickup],{padding:[60,60]});document.getElementById('routeWarning').textContent='Rota hazırlanıyor...';timer=setInterval(update,120);update();
try{const url='https://router.project-osrm.org/route/v1/driving/'+origin[1]+','+origin[0]+';'+pickup[1]+','+pickup[0]+'?overview=full&geometries=geojson';const response=await fetch(url);if(!response.ok)throw Error('route');const json=await response.json();if(!trip||!json.routes?.[0])return;const coords=json.routes[0].geometry.coordinates.map(p=>[p[1],p[0]]);if(coords.length>1){route=coords;line.setLatLngs(route);document.getElementById('routeWarning').textContent='Sanal araç, örnek yol güzergâhında ilerliyor.'}}catch(e){document.getElementById('routeWarning').textContent='Yol rotası alınamadı; düz çizgi simülasyonu kullanılıyor.'}};
document.getElementById('cancel').onclick=()=>{clearInterval(timer);trip=null;route=[];if(moving)map.removeLayer(moving);if(line)map.removeLayer(line);moving=line=null;document.getElementById('active').hidden=true;document.getElementById('idle').hidden=false;document.getElementById('headline').textContent='Sanal taksin yaklaşıyor';showNearby();map.setView(pickup,15)};
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
